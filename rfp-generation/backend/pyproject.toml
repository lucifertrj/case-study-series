[project]
name = "rfp-generation-backend"
version = "0.1.0"
description = "FastAPI backend for the RFP Response Generator"
requires-python = ">=3.11"
dependencies = [
    "aiofiles==25.1.0",
    "cognee==1.4.0",
    "fastapi==0.139.2",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "qdrant-client==1.18.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
